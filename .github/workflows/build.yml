name: Build PageCapture Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate comtypes UIA bindings
        run: |
          python -c "import comtypes.client; comtypes.client.GetModule('UIAutomationCore.dll')"
        continue-on-error: true

      - name: Generate icon
        run: python make_icon.py

      - name: Build executable with PyInstaller
        run: pyinstaller pagecapture.spec --clean --noconfirm

      - name: Install NSIS
        run: choco install nsis --yes

      - name: Build installer with NSIS
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi'

      - name: Upload installer as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PageCapture_Setup
          path: PageCapture_Setup.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PageCapture v1.0.${{ github.run_number }}
          body: |
            Windows installer — download PageCapture_Setup.exe below.
            Double-click to install. Desktop icon created automatically.
          files: PageCapture_Setup.exe
          draft: false
          prerelease: false
